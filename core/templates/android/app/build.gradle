plugins {
    id 'com.android.application'
}

android {
    namespace '{{PACKAGE}}'
    compileSdk 34

    defaultConfig {
        applicationId '{{PACKAGE}}'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// لا اعتماديات خارجية: واجهة التطبيق صفحة HTML داخل WebView، والمنطق برنامج EE# مُترجَم إلى JS.
