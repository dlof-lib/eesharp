<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عدّاد EE#</title>
<style>
  body { font: 18px/1.8 system-ui, sans-serif; max-width: 520px; margin: 24px auto; padding: 0 16px; }
  button { font: inherit; padding: 6px 14px; }
  .كبير { font-size: 2rem; color: #8a5a2b; }
</style>
</head>
<body>
  <h1>عدّاد وتحية</h1>

  <p>
    <input id="اسم" placeholder="اسمك">
    <button id="سلم">سلّم</button>
  </p>
  <p id="تحية"></p>

  <p>
    <button id="زيادة">+1</button>
    <button id="تصفير">تصفير</button>
    <span id="العدد" class="كبير">0</span>
  </p>
  <p id="ساعة"></p>

  <!-- كود EE# داخل الصفحة: يُترجَم إلى JavaScript وقت البناء بـ:  ee translate عداد.html -->
  <script type="text/ee">
متغير <<عدد>> = $رقم($صدفة_اقرأ_مخزن("عدد"))
لو <<عدد>> = عدم
  <<عدد>> = 0
نهاية لو
$صدفة_نص("#العدد", <<عدد>>)

مفهوم $حدّث()
  $صدفة_نص("#العدد", <<عدد>>)
  $صدفة_خزن("عدد", <<عدد>>)
  $صدفة_صنف("#العدد", "كبير", <<عدد>> < 10)
نهاية

مفهوم $سلم_على(<<ق>>)
  متغير <<الاسم>> = $قص_فراغ($صدفة_قيمة("#اسم"))
  لو $طول(<<الاسم>>) = 0
    $صدفة_نص("#تحية", "اكتب اسمك أولاً")
  والا
    $صدفة_نص("#تحية", "أهلاً يا " + <<الاسم>> + "! المنصة: " + <<منصة>>)
  نهاية لو
نهاية

مفهوم $زد(<<ق>>)
  <<عدد>> += 1
  $حدّث()
نهاية

مفهوم $صفّر(<<ق>>)
  <<عدد>> = 0
  $حدّث()
نهاية

$صدفة_اربط("#سلم", "click", $سلم_على)
$صدفة_اربط("#زيادة", "click", $زد)
$صدفة_اربط("#تصفير", "click", $صفّر)

// مؤقت يتكرر كل ثانية
متغير <<ثوان>> = 0
$صدفة_كرر_كل(1000, مفهوم()
  <<ثوان>> += 1
  $صدفة_نص("#ساعة", "مرّت " + $ارقام_عربية(<<ثوان>>) + " ثانية")
نهاية)
  </script>
</body>
</html>
